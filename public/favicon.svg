<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Rounded Modern Base -->
  <rect width="64" height="64" rx="16" fill="#090A0D" />
  <rect width="64" height="64" rx="16" stroke="rgba(255, 113, 56, 0.35)" stroke-width="2" />

  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="32" r="20" fill="url(#glow-grad)" />

  <!-- Monogram 'A' with Cybernetic / Developer Aesthetic -->
  <path 
    d="M32 12 L17 48 L25.5 48 L28.5 40 L35.5 40 L38.5 48 L47 48 Z M32 23.5 L34.2 33 L29.8 33 Z" 
    fill="url(#accent-grad)"
  />

  <!-- High-Tech Neon Dot -->
  <circle cx="47" cy="17" r="4" fill="#FF7138" />
  <circle cx="47" cy="17" r="2" fill="#FFF" />

  <defs>
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7138" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF7138" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF895D" />
      <stop offset="100%" stop-color="#FF7138" />
    </linearGradient>
  </defs>
</svg>
